services:
  postgres-restaurant:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: restaurant_db, POSTGRES_USER: meal_mate, POSTGRES_PASSWORD: meal_mate }
    ports: ["55432:5432"]
    volumes: [restaurant-data:/var/lib/postgresql/data]
  postgres-availability:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: availability_db, POSTGRES_USER: meal_mate, POSTGRES_PASSWORD: meal_mate }
    ports: ["55433:5432"]
    volumes: [availability-data:/var/lib/postgresql/data]
  postgres-order:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: order_db, POSTGRES_USER: meal_mate, POSTGRES_PASSWORD: meal_mate }
    ports: ["55434:5432"]
    volumes: [order-data:/var/lib/postgresql/data]
  postgres-payment:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: payment_db, POSTGRES_USER: meal_mate, POSTGRES_PASSWORD: meal_mate }
    ports: ["55435:5432"]
    volumes: [payment-data:/var/lib/postgresql/data]
  postgres-delivery:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: delivery_db, POSTGRES_USER: meal_mate, POSTGRES_PASSWORD: meal_mate }
    ports: ["55436:5432"]
    volumes: [delivery-data:/var/lib/postgresql/data]
  postgres-notification:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: notification_db, POSTGRES_USER: meal_mate, POSTGRES_PASSWORD: meal_mate }
    ports: ["55437:5432"]
    volumes: [notification-data:/var/lib/postgresql/data]
  kafka:
    image: soldevelo/kafka:3.8
    ports: ["59092:9092"]
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    volumes: [kafka-data:/bitnami/kafka]
  discovery-server: { build: ./discovery-server, ports: ["8761:8761"] }
  api-gateway:
    build: ./api-gateway
    ports: ["9000:9000"]
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      RESTAURANT_SERVICE_HOST: restaurant-service
      AVAILABILITY_SERVICE_HOST: availability-service
      DELIVERY_ORDER_SERVICE_HOST: delivery-order-service
      PAYMENT_SERVICE_HOST: payment-service
      DELIVERY_SERVICE_HOST: delivery-service
      NOTIFICATION_SERVICE_HOST: notification-service
    depends_on: [discovery-server, kafka]
  restaurant-service:
    build: ./restaurant-service
    ports: ["8081:8081"]
    environment: { DB_URL: jdbc:postgresql://postgres-restaurant:5432/restaurant_db, DB_USERNAME: meal_mate, DB_PASSWORD: meal_mate, EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/ }
    depends_on: [postgres-restaurant, discovery-server]
  availability-service:
    build: ./availability-service
    ports: ["8082:8082"]
    environment: { DB_URL: jdbc:postgresql://postgres-availability:5432/availability_db, DB_USERNAME: meal_mate, DB_PASSWORD: meal_mate, EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/ }
    depends_on: [postgres-availability, discovery-server]
  delivery-order-service:
    build: ./delivery-order-service
    ports: ["8083:8083"]
    environment: { DB_URL: jdbc:postgresql://postgres-order:5432/order_db, DB_USERNAME: meal_mate, DB_PASSWORD: meal_mate, KAFKA_BOOTSTRAP_SERVERS: kafka:9092, AVAILABILITY_URL: http://availability-service:8082, INTERNAL_TOKEN: meal-mate-internal, EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/ }
    depends_on: [postgres-order, availability-service, kafka, discovery-server]
  payment-service:
    build: ./payment-service
    ports: ["8084:8084"]
    environment: { DB_URL: jdbc:postgresql://postgres-payment:5432/payment_db, DB_USERNAME: meal_mate, DB_PASSWORD: meal_mate, KAFKA_BOOTSTRAP_SERVERS: kafka:9092, EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/ }
    depends_on: [postgres-payment, kafka, discovery-server]
  delivery-service:
    build: ./delivery-service
    ports: ["8085:8085"]
    environment: { DB_URL: jdbc:postgresql://postgres-delivery:5432/delivery_db, DB_USERNAME: meal_mate, DB_PASSWORD: meal_mate, KAFKA_BOOTSTRAP_SERVERS: kafka:9092, EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/ }
    depends_on: [postgres-delivery, kafka, discovery-server]
  notification-service:
    build: ./notification-service
    ports: ["8086:8086"]
    environment: { DB_URL: jdbc:postgresql://postgres-notification:5432/notification_db, DB_USERNAME: meal_mate, DB_PASSWORD: meal_mate, KAFKA_BOOTSTRAP_SERVERS: kafka:9092, EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/ }
    depends_on: [postgres-notification, kafka, discovery-server]
  frontend:
    build: ./frontend
    ports: ["3000:80"]
    depends_on: [api-gateway]
volumes:
  restaurant-data: {}
  availability-data: {}
  order-data: {}
  payment-data: {}
  delivery-data: {}
  notification-data: {}
  kafka-data: {}
