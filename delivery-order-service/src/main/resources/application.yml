server.port: ${SERVER_PORT:8083}
spring.application.name: delivery-order-service
spring.datasource.url: ${DB_URL:jdbc:postgresql://localhost:5435/meal_orders}
spring.datasource.username: ${DB_USERNAME:postgres}
spring.datasource.password: ${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto: ${JPA_DDL_AUTO:update}
spring.kafka.bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers: false
spring.kafka.consumer.value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.use.type.headers: false
spring.kafka.consumer.properties.spring.json.value.default.type: com.mealmate.order.OrderService$Event
spring.kafka.consumer.properties.spring.json.trusted.packages: com.mealmate.order
services.availability-url: ${AVAILABILITY_URL:http://localhost:8082}
internal.token: ${INTERNAL_TOKEN:meal-mate-internal}
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
