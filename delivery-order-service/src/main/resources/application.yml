server.port: ${SERVER_PORT:8083}
spring.application.name: delivery-order-service
spring.datasource.url: ${DB_URL:jdbc:postgresql://localhost:5435/meal_orders}
spring.datasource.username: ${DB_USERNAME:postgres}
spring.datasource.password: ${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto: ${JPA_DDL_AUTO:update}
spring.kafka.bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
services.availability-url: ${AVAILABILITY_URL:http://localhost:8082}
internal.token: ${INTERNAL_TOKEN:meal-mate-internal}
